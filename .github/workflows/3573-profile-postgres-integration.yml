name: 3573 guarded profile PostgreSQL integration

on:
  push:
    branches:
      - work/3573-player-profile-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-rls-and-conflict:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: profile_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profile_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SQL migration with real PostgreSQL and RLS
        env:
          PGPASSWORD: integration-only
        run: psql -h 127.0.0.1 -U postgres -d profile_integration -v ON_ERROR_STOP=1 -f tests/sql/3573_guarded_profile_integration.sql
