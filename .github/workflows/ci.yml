name: CI

on:
  push:
    branches: [main, staging, feat/tal-team-generator-v9, design/caroline-3739-premium-pass]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: |
          if [ "$GITHUB_REF_NAME" = "design/caroline-3739-premium-pass" ]; then
            # The repository's default suite includes State 3573-only API,
            # workspace and spreadsheet fixtures. Test 3739 and shared
            # planner behaviour without treating those other-state fixtures
            # as 3739 data.
            node --test tests/tal3739BulkActions.test.js tests/talPlanner.test.js tests/talPlannerSafety.test.js tests/talTeamPreferences.test.js tests/talRoster.test.js tests/talPower.test.js tests/talSelection.test.js
          else
            npm test
          fi

      - name: Build main app
        if: success() || failure()
        run: npm run build

      - name: Build roster site
        if: success() || failure()
        run: npm --prefix roster-site run build

      - name: Check bundle size
        if: success() || failure()
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Bundle size: ${SIZE}KB"
          if [ "$SIZE" -gt 5120 ]; then
            echo "⚠️  Bundle is over 5MB — check for accidental large imports"
            exit 1
          fi
