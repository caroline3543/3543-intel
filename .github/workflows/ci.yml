name: CI

on:
  push:
    branches: [main, staging, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build:
    name: Rules, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js 2.110 declares engines node >= 22
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Constitution rules (hard bans + legacy-debt ratchet + secret scan)
        run: npm run check:rules

      - name: Type check (ratcheted checkJs on services/utils/data)
        # Informational until the CI baseline is confirmed equal to the local one; then remove this line.
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Bundle size: ${SIZE}KB"
          if [ "$SIZE" -gt 5120 ]; then
            echo "⚠️  Bundle is over 5MB — check for accidental large imports"
            exit 1
          fi

  browser:
    name: Browser regression (iPhone viewport)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installed without saving so package.json / package-lock.json stay unchanged.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Browser suites (synthetic fixtures only, no provider calls)
        env:
          REQUIRE_APP: '1'
        run: npm run test:browser
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
