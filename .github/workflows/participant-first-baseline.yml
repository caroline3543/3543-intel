name: Participant-first baseline integrity
on:
  push:
    branches: ['fix/3573-paste-only']
  pull_request:
    paths:
      - 'docs/design-baselines/state-3573/participant-first-v1/**'
      - 'roster-site/**'
      - 'scripts/verify-participant-first-baseline.py'
      - '.github/workflows/participant-first-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-approved-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify approved reference assets
        run: python3 scripts/verify-participant-first-baseline.py
