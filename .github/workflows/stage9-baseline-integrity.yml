name: Stage 9 baseline integrity
on:
  push:
    branches: ['fix/3573-ocr-upgrade']
  pull_request:
    paths:
      - 'docs/design-baselines/state-3573/ocr-import-v1/**'
      - 'roster-site/**'
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/stage9-baseline-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-reference-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable visual references
        working-directory: docs/design-baselines/state-3573/ocr-import-v1
        run: sha256sum --strict -c SHA256SUMS
  existing-regression-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build --prefix roster-site
  event-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: BUILD_PROFILE_FIXTURE=1 npm run build --prefix roster-site
      - run: node tests/3573-event-planner-browser.mjs
      - name: Mobile OCR upload acceptance
        if: always()
        run: node tests/3573-ocr-upload-browser.mjs
      - name: Deterministic OCR review acceptance
        if: always()
        run: node tests/3573-ocr-review-browser.mjs
      - name: Retain current implementation captures for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-current-ocr-captures
          path: ocr-review-captures/
          if-no-files-found: warn
