name: 3573 Membership Checks
on:
  pull_request:
    paths:
      - 'src/services/rosterViewService.js'
      - 'src/services/verifiedPlayerLocation.js'
      - 'src/components/players/RosterTab.jsx'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/3573-membership-checks.yml'
  push:
    branches:
      - 'work/3573-membership-review-rolling-24h'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
