name: 3573 implementation checks

on:
  pull_request:
    branches:
      - feat/3573-independent-tal-locks-alliance-moves
      - release/3573-production
  push:
    branches:
      - work/3573-design-system-implementation
      - work/3573-production-backlog-reconciliation
      - release/3573-membership-integration
      - work/3573-compare-live-data-redesign

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - name: Targeted 3573 regression tests
        run: node --test tests/deletion-merge-safety.test.js tests/bulk-joiner-heroes.test.js tests/fuzzy-player-matching.test.js tests/roster-search-consistency.test.js tests/talPoll.test.js
      - name: Full repository regression suite
        run: npm test
      - name: Repository build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: 3573 roster-site production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build --prefix roster-site

      - name: Install isolated browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance smoke test
        run: node tests/3573-browser-smoke.mjs

      - name: Bulk import mobile and desktop interaction test
        run: node tests/3573-bulk-import-browser.mjs
