name: 3573 Membership Automation Tests
on:
  push:
    branches:
      - work/3573-automatic-membership-transfer-tracking
      - work/3573-refresh-reconciliation
  pull_request:
    branches:
      - release/3573-production
  workflow_dispatch:
permissions:
  contents: read
jobs:
  membership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: membership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d membership_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Membership regression suite
        run: node --test tests/automaticMembership*.test.js
      - name: Compile staged membership SQL in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: membership_test
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.caroline_workspaces (id text PRIMARY KEY, data jsonb NOT NULL DEFAULT '{}'::jsonb, revision bigint NOT NULL DEFAULT 0, updated_at timestamptz, updated_by text);"
          psql -v ON_ERROR_STOP=1 -f database/3573_automatic_membership_schema.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_automatic_membership_worker_functions.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_membership_roster_snapshot.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_membership_atomic_commit.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_membership_transfer_feed.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_membership_shared_budget.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_membership_manual_refresh.sql
          psql -v ON_ERROR_STOP=1 -f database/3573_priority_roster_refresh.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_postgres_integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_roster_postgres_integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_no_alliance_postgres_integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_transfer_feed_postgres.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_shared_budget_postgres.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_membership_manual_refresh_postgres.sql
          psql -v ON_ERROR_STOP=1 -f tests/3573_priority_roster_refresh_postgres.sql
      - name: Verify competing database sessions honor the same quota
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: membership_test
        run: |
          first=$(mktemp)
          second=$(mktemp)
          trap 'rm -f "$first" "$second"' EXIT
          psql -Aqt -v ON_ERROR_STOP=1 -c "select membership_3573.reserve_request_credits('2026-11-20T14:00:00Z',1,100,59)" > "$first" &
          first_pid=$!
          psql -Aqt -v ON_ERROR_STOP=1 -c "select membership_3573.reserve_request_credits('2026-11-20T14:00:00Z',1,100,59)" > "$second" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          test "$(printf '%s\n' "$(cat "$first")" "$(cat "$second")" | sort | tr -d '\n')" = 'ft'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck staged private worker
        run: deno check --config supabase/functions/caroline3573-membership-worker/deno.json supabase/functions/caroline3573-membership-worker/index.ts
      - name: Production build check
        run: npm run build && npm run build --prefix roster-site
      - name: Install isolated browser test dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1 postgres@3.4.7
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify provider to database to the roster screen
        env:
          MEMBERSHIP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/membership_test
        run: node tests/3573-membership-refresh-e2e.mjs
  provider-diagnostic:
    if: >-
      (vars.WOS_DIAGNOSTIC_IN_CI == 'true' && github.event_name == 'push') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'work/3573-refresh-reconciliation')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real provider response
        env:
          WOS_DIAGNOSTIC_KEY: ${{ secrets.WOS_DIAGNOSTIC_KEY || secrets.WHITEOUTSTATS_API_KEY }}
          WOS_TEST_TAG: HOT
        run: |
          if [[ -z "$WOS_DIAGNOSTIC_KEY" ]]; then
            echo 'Whiteout Stats key unavailable to this runner. No provider calls made.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/3573-provider-diagnostic.mjs

  cron-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Rehearse Supabase Cron through the worker on an isolated runner
        run: bash tests/3573-cron-rehearsal.sh
      - name: Show database startup logs on failure
        if: failure()
        run: docker logs membership-fixture-db
