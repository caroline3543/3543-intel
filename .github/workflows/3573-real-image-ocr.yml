name: Real-image OCR benchmark
on:
  workflow_dispatch:
  pull_request:
    branches: [main, verification/3573-ocr-ci-base]
    paths: ['tests/fixtures/3573-ocr/**', 'tests/3573-*.mjs', 'roster-site/src/foundry/**', '.github/workflows/3573-real-image-ocr.yml']
  push:
    branches: [fix/3573-ocr-upgrade, release/3573-ocr-candidate, fix/3573-review-speed, fix/3573-paste-first]
    paths: ['tests/fixtures/3573-ocr/**', '.github/workflows/3573-real-image-ocr.yml', 'tests/3573-*.mjs', 'roster-site/src/foundry/**', 'roster-site/src/eventPreview.jsx']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixture integrity
        working-directory: tests/fixtures/3573-ocr
        run: sha256sum --strict -c SHA256SUMS
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Build isolated roster preview
        run: BUILD_PROFILE_FIXTURE=1 npm run build --prefix roster-site
      - name: Execute roster import and squad browser regressions
        run: |
          node tests/3573-ocr-review-browser.mjs
          node tests/3573-ocr-upload-browser.mjs
          node tests/3573-event-planner-browser.mjs
          node tests/3573-paste-squads-browser.mjs
      - name: Measure cold paste matching
        run: node tests/3573-paste-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-review-captures
          path: |
            ocr-review-captures/
            paste-squad-captures/
      - name: Execute actual OCR
        if: ${{ !cancelled() }}
        env:
          ROSTER_SCREENSHOTS_DIR: tests/fixtures/3573-ocr/screenshots
          ROSTER_NEGATIVE_SCREENSHOT: tests/fixtures/3573-ocr/negative/IMG_9839.jpeg
          ROSTER_GROUND_TRUTH: tests/fixtures/3573-ocr/ground-truth.json
        run: |
          for workers in 1 2 3 4; do
            for trial in 1 2 3; do
              ROSTER_OCR_WORKERS=$workers node tests/3573-roster-ocr-benchmark.mjs "$GITHUB_WORKSPACE/ocr-results-$workers-$trial.json"
            done
          done
          node tests/3573-ocr-performance-compare.mjs
          for trial in 1 2 3; do
            ROSTER_OCR_RETRIES=0 ROSTER_OCR_WORKERS=2 node tests/3573-roster-ocr-benchmark.mjs "$GITHUB_WORKSPACE/ocr-results-baseline-$trial.json"
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const load=p=>JSON.parse(readFileSync(p,'utf8'));
          const median=a=>a.sort((a,b)=>a-b)[1];
          const baseline=[1,2,3].map(i=>load('ocr-results-baseline-'+i+'.json'));
          const improved=[1,2,3].map(i=>load('ocr-results-2-'+i+'.json'));
          const summarize=a=>({medianMs:median(a.map(x=>x.recognitionBatchMs)),rawNameCorrect:a[0].scores.reduce((n,s)=>n+s.nameCorrect,0),expected:a[0].scores.reduce((n,s)=>n+s.expected,0),retryMetrics:a[0].retryMetrics,identityReview:a[0].reviewMetrics});
          const b=summarize(baseline),n=summarize(improved);
          const reduction=b.identityReview.manual?100*(1-n.identityReview.manual/b.identityReview.manual):null;
          const safe=n.identityReview.automaticWrong===0;
          console.log(JSON.stringify({baseline:b,improved:n,overheadPercent:100*(n.medianMs/b.medianMs-1),manualIdentityReviewReductionPercent:reduction,zeroWrongAutomaticMatches:safe,targetMet:safe&&reduction!==null&&reduction>=30,scope:'label-derived roster; identity reviews only'},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-image-ocr-results
          path: ocr-results*.json
